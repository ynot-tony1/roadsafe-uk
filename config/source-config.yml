# Source discovery configuration for the ingestor's `discover` command.
#
# The ingestor prefers CKAN's resource listing (works out which years are
# final vs. provisional from resource names and descriptions, so it does
# not need updating on every publication), and falls back to each
# dataset's direct_url below when CKAN doesn't list a matching resource.

dft_road_safety:
  metadata_url: "https://www.data.gov.uk/dataset/road-accidents-safety-data"
  # data.gov.uk API used to enumerate resources and their revision timestamps.
  ckan_api_url: "https://data.gov.uk/api/3/action/package_show?id=road-accidents-safety-data"

  # The live data.gov.uk CKAN package for this dataset does not actually
  # list the bulk CSV files as resources (confirmed by querying it
  # directly), only guidance documents. The files exist regardless, at a
  # fixed, versionless URL per dataset kind. direct_url is the fallback
  # used when CKAN's resource list has no match for resource_name_pattern.
  datasets:
    collisions:
      resource_name_pattern: "dft-road-casualty-statistics-collision"
      direct_url: "https://data.dft.gov.uk/road-accidents-safety-data/dft-road-casualty-statistics-collision-last-5-years.csv"
    vehicles:
      resource_name_pattern: "dft-road-casualty-statistics-vehicle"
      direct_url: "https://data.dft.gov.uk/road-accidents-safety-data/dft-road-casualty-statistics-vehicle-last-5-years.csv"
    casualties:
      resource_name_pattern: "dft-road-casualty-statistics-casualty"
      direct_url: "https://data.dft.gov.uk/road-accidents-safety-data/dft-road-casualty-statistics-casualty-last-5-years.csv"

  code_lists:
    resource_name_pattern: "road-safety-open-dataset-data-guide"

optional_exposure_datasets:
  road_traffic_estimates:
    source: "Department for Transport, road traffic statistics (TRA)"
    ckan_api_url: "https://data.gov.uk/api/3/action/package_show?id=gb-road-traffic-counts"
    denominator: "vehicle_miles"
    enabled: false
  population_estimates:
    source: "Office for National Statistics, mid-year population estimates"
    denominator: "population"
    enabled: false

discovery:
  # How many years back to scan when identifying the "latest five complete
  # final years" window described in spec section 6.
  max_years_to_scan: 10
  # Ingestion of provisional data is a two-key switch: this repository
  # default plus the GitHub repository variable PROVISIONAL_DATA_ENABLED.
  provisional_import_default_enabled: false
