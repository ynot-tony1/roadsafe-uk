[project]
name = "roadsafe-ingestor"
version = "0.1.0"
description = "RoadSafe UK ingestion service: discovers, downloads and loads DfT STATS19 road safety data into CockroachDB"
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]==3.2.3",
  "httpx==0.27.2",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "pyyaml==6.0.2",
  "typer==0.12.5",
  "click<8.2",
  "tenacity==9.0.0",
  "polars==1.9.0",
  "h3==4.1.2",
  "shapely==2.0.6",
  "pyproj==3.7.0",
]

[project.scripts]
ingestor = "roadsafe_ingestor.cli:app"

[dependency-groups]
dev = [
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
  "ruff==0.6.9",
  "mypy==1.11.2",
  "types-shapely==2.0.0.20240820",
  "types-PyYAML==6.0.12.20240917",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roadsafe_ingestor"]
